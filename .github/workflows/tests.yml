name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set dummy API key
        # Tests mock the LLM entirely -- this key is never actually used
        # to call Anthropic, it only satisfies config.py's startup check.
        run: echo "ANTHROPIC_API_KEY=sk-ant-fake-for-ci" >> .env

      - name: Run test suite (20 tests, mocked LLM, zero API cost)
        run: |
          for f in tests/test_*.py; do
            echo "--- $f ---"
            python "$f"
          done
